name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write          # 建 draft Release 需要写权限（默认是只读）
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Versions
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        # --ignore-scripts：electron 的二进制由 electron-packager 自己按版本下载，
        # CI 里不需要在 node_modules 里装一份（也避开 pnpm 的 ERR_PNPM_IGNORED_BUILDS）。

      - name: Build (electron-packager)
        shell: bash
        run: bash build.sh

      - name: Zip artifact
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path "dist/桌边-win32-x64/*" -DestinationPath "桌边-win32-x64-$ver.zip"
          (Get-FileHash "桌边-win32-x64-$ver.zip" -Algorithm SHA256).Hash |
            Out-File "桌边-win32-x64-$ver.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: deskside-windows
          path: |
            桌边-win32-x64-*.zip
            桌边-win32-x64-*.zip.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 桌边 Deskside ${{ github.ref_name }}
          files: |
            桌边-win32-x64-*.zip
            桌边-win32-x64-*.zip.sha256
          draft: false
          generate_release_notes: true
          body: |
            ## 桌边 Deskside ${{ github.ref_name }}

            Windows 免安装版：下载 `桌边-win32-x64-*.zip`，解压后双击 `桌边.exe`。
            首次打开会有一个三步向导，选一家模型服务、粘一个 API Key 就能用。

            - 校验：同目录的 `.sha256` 文件，`certutil -hashfile 桌边-win32-x64-*.zip SHA256` 对一下。
            - 数据存在 `%APPDATA%\桌边`，卸载/删包不影响你的待办和聊天记录。
            - 详细说明见压缩包里的 `README.md` 和 `使用说明.md`。
