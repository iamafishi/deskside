name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (electron-packager)
        shell: bash
        run: bash build.sh

      - name: Zip artifact
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -Path "dist/桌边-win32-x64/*" -DestinationPath "桌边-win32-x64-$ver.zip"
          (Get-FileHash "桌边-win32-x64-$ver.zip" -Algorithm SHA256).Hash |
            Out-File "桌边-win32-x64-$ver.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: deskside-windows
          path: |
            桌边-win32-x64-*.zip
            桌边-win32-x64-*.zip.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            桌边-win32-x64-*.zip
            桌边-win32-x64-*.zip.sha256
          draft: true
